<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .sidebar { fill: #111827; }
      .accent { fill: #F59E0B; }
      .accent-soft { fill: #FDE68A; }
      .card { fill: #ffffff; stroke: #e6e9ee; rx:12; ry:12; }
      .muted { fill: #6b7280; font-family: Inter, Arial, sans-serif; }
      .title { fill: #0f172a; font-family: Inter, Arial, sans-serif; font-weight:700; }
      .small { font-size:12px; }
      .large { font-size:20px; font-weight:700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1200" height="700"/>

  <!-- Sidebar -->
  <rect class="sidebar" x="20" y="20" width="180" height="660" rx="14"/>
  <text x="110" y="60" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial" font-size="16" font-weight="700">HQ</text>
  <g fill="#c7cfd9" font-family="Inter, Arial" font-size="13">
    <text x="40" y="110">Dashboard</text>
    <text x="40" y="140">Tenants</text>
    <text x="40" y="170">Billing</text>
    <text x="40" y="200">Features</text>
    <text x="40" y="230">Audit Logs</text>
    <text x="40" y="260">Reports</text>
  </g>

  <!-- Top banner -->
  <rect x="220" y="20" width="960" height="120" rx="12" ry="12" fill="#0f172a"/>
  <text x="250" y="64" class="title" style="fill:#ffffff; font-size:22px;">Welcome back, Super Admin 👋</text>
  <text x="250" y="92" class="muted small" style="fill:rgba(255,255,255,0.75);">Platform control and tenant orchestration</text>
  <rect x="1080" y="40" width="100" height="40" rx="8" fill="#F59E0B"/>
  <text x="1130" y="66" fill="#08121a" font-family="Inter, Arial" font-size="14" text-anchor="middle">Onboard</text>

  <!-- Stat cards -->
  <g transform="translate(220,160)">
    <rect class="card" x="0" y="0" width="300" height="90"/>
    <text x="20" y="30" class="muted small">Active schools</text>
    <text x="20" y="60" class="large">3</text>

    <rect class="card" x="340" y="0" width="300" height="90"/>
    <text x="360" y="30" class="muted small">Monthly revenue</text>
    <text x="360" y="60" class="large">KSh 43.5k</text>

    <rect class="card" x="680" y="0" width="300" height="90"/>
    <text x="700" y="30" class="muted small">System health</text>
    <text x="700" y="60" class="large">99.9%</text>
  </g>

  <!-- Main content area -->
  <rect x="220" y="270" width="660" height="380" rx="12" class="card"/>
  <text x="240" y="300" class="muted small">Platform Control</text>
  <text x="240" y="322" class="title" style="font-size:18px;">Key Features</text>

  <!-- Feature tiles -->
  <g transform="translate(240,340)">
    <rect x="0" y="0" width="200" height="70" rx="10" class="card"/>
    <text x="16" y="28" class="title" style="font-size:14px;">School onboarding</text>
    <text x="16" y="48" class="muted small">Create tenants and assign plans</text>

    <rect x="220" y="0" width="200" height="70" rx="10" class="card"/>
    <text x="236" y="28" class="title" style="font-size:14px;">Subscription billing</text>
    <text x="236" y="48" class="muted small">Track plan tier and cycles</text>

    <rect x="440" y="0" width="200" height="70" rx="10" class="card"/>
    <text x="456" y="28" class="title" style="font-size:14px;">Feature toggles</text>
    <text x="456" y="48" class="muted small">Enable/disable features</text>

    <rect x="0" y="90" width="200" height="70" rx="10" class="card"/>
    <text x="16" y="118" class="title" style="font-size:14px;">Audit logs</text>
    <text x="16" y="138" class="muted small">Security-critical events</text>

    <rect x="220" y="90" width="200" height="70" rx="10" class="card"/>
    <text x="236" y="118" class="title" style="font-size:14px;">System health</text>
    <text x="236" y="138" class="muted small">API, queue, and DB uptime</text>

    <rect x="440" y="90" width="200" height="70" rx="10" class="card"/>
    <text x="456" y="118" class="title" style="font-size:14px;">Revenue analytics</text>
    <text x="456" y="138" class="muted small">MRR, churn, county views</text>
  </g>

  <!-- Right activity feed -->
  <rect x="900" y="270" width="280" height="380" rx="12" class="card"/>
  <text x="920" y="300" class="muted small">Recent Activity</text>
  <g transform="translate(920,320)" font-family="Inter, Arial" font-size="13">
    <g>
      <circle cx="12" cy="16" r="6" fill="#10B981"/>
      <text x="28" y="20" fill="#0f172a">New school onboarded: Sunrise Academy</text>
      <text x="28" y="36" class="muted small">2h ago</text>
    </g>
    <g transform="translate(0,54)">
      <circle cx="12" cy="16" r="6" fill="#60A5FA"/>
      <text x="28" y="20" fill="#0f172a">Subscription renewed: Green Valley</text>
      <text x="28" y="36" class="muted small">5h ago</text>
    </g>
    <g transform="translate(0,108)">
      <circle cx="12" cy="16" r="6" fill="#FDE68A"/>
      <text x="28" y="20" fill="#0f172a">Feature toggle changed</text>
      <text x="28" y="36" class="muted small">2d ago</text>
    </g>
    <g transform="translate(0,162)">
      <circle cx="12" cy="16" r="6" fill="#F59E0B"/>
      <text x="28" y="20" fill="#0f172a">Storage limit approaching</text>
      <text x="28" y="36" class="muted small">3d ago</text>
    </g>
  </g>

  <!-- Color legend -->
  <g transform="translate(220,670)">
    <text x="0" y="0" class="muted small">Primary palette:</text>
    <rect x="120" y="-12" width="24" height="24" rx="4" fill="#111827" stroke="#ccc"/>
    <text x="152" y="6" class="muted small">Sidebar / dark</text>
    <rect x="300" y="-12" width="24" height="24" rx="4" fill="#F59E0B" stroke="#ccc"/>
    <text x="332" y="6" class="muted small">Accent / action</text>
    <rect x="480" y="-12" width="24" height="24" rx="4" fill="#FDE68A" stroke="#ccc"/>
    <text x="512" y="6" class="muted small">Accent soft</text>
  </g>

</svg>
