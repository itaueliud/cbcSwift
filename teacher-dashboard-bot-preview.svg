<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #e6e9ee; rx:14; ry:14; }
      .sidebar { fill: #0e4f7a; }
      .accent { fill: #0ea5e9; }
      .accent-soft { fill: #dbeafe; }
      .text-dark { fill: #0f172a; font-family: Inter, Arial, sans-serif; }
      .text-muted { fill: #64748b; font-family: Inter, Arial, sans-serif; }
      .title { font-size: 22px; font-weight: 700; }
      .small { font-size: 12px; }
      .badge { fill: #eef2ff; stroke: #bfdbfe; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <rect class="sidebar" x="28" y="28" width="200" height="704" rx="18"/>
  <text x="128" y="72" fill="#f8fafc" font-family="Inter, Arial" font-size="18" font-weight="700" text-anchor="middle">Teacher</text>
  <text x="128" y="112" fill="#cbd5e1" font-family="Inter, Arial" font-size="13" text-anchor="middle">CBC Swift</text>
  <g fill="#cbd5e1" font-family="Inter, Arial" font-size="13">
    <text x="48" y="170">My Dashboard</text>
    <text x="48" y="205">Attendance</text>
    <text x="48" y="240">Mark Entry</text>
    <text x="48" y="275">Assignments</text>
    <text x="48" y="310">Portfolio</text>
    <text x="48" y="345">Reports</text>
    <text x="48" y="390">Chat</text>
    <text x="48" y="425">Notifications</text>
  </g>

  <rect class="panel" x="248" y="28" width="924" height="140" rx="18"/>
  <text x="268" y="64" class="text-dark title">Teacher dashboard</text>
  <text x="268" y="92" class="text-muted small">Attendance, mark entry and student progress in one place.</text>
  <rect x="1030" y="50" width="130" height="42" rx="12" class="badge"/>
  <text x="1095" y="80" fill="#0f172a" font-family="Inter, Arial" font-size="13" text-anchor="middle">Teacher</text>

  <g transform="translate(248,184)">
    <rect class="panel" x="0" y="0" width="300" height="120"/>
    <text x="24" y="30" class="text-muted small">Class size</text>
    <text x="24" y="70" class="text-dark title">32</text>
    <rect class="panel" x="320" y="0" width="300" height="120"/>
    <text x="344" y="30" class="text-muted small">Marked today</text>
    <text x="344" y="70" class="text-dark title">18</text>
    <rect class="panel" x="640" y="0" width="300" height="120"/>
    <text x="664" y="30" class="text-muted small">Pending tasks</text>
    <text x="664" y="70" class="text-dark title">5</text>
  </g>

  <g transform="translate(248,322)">
    <rect class="panel" x="0" y="0" width="924" height="220"/>
    <text x="24" y="34" class="text-dark subtitle">Attendance sheet</text>
    <rect x="24" y="54" width="876" height="150" rx="14" fill="#f8fafc"/>
    <g class="text-muted small" font-family="Inter, Arial, sans-serif">
      <text x="40" y="86">Student name</text>
      <text x="320" y="86">Present</text>
      <text x="430" y="86">Absent</text>
      <text x="540" y="86">Late</text>
      <text x="680" y="86">Status</text>
    </g>
    <g class="text-dark" font-family="Inter, Arial, sans-serif" font-size="13">
      <text x="40" y="118">Jane Mwangi</text>
      <text x="320" y="118">✅</text>
      <text x="430" y="118">❌</text>
      <text x="540" y="118">⏰</text>
      <text x="680" y="118">Present</text>

      <text x="40" y="150">Brian Ochieng</text>
      <text x="320" y="150">✅</text>
      <text x="430" y="150">❌</text>
      <text x="540" y="150">⏰</text>
      <text x="680" y="150">Absent</text>

      <text x="40" y="182">Aisha Njeri</text>
      <text x="320" y="182">✅</text>
      <text x="430" y="182">❌</text>
      <text x="540" y="182">⏰</text>
      <text x="680" y="182">Late</text>
    </g>
  </g>

  <g transform="translate(248,562)">
    <rect class="panel" x="0" y="0" width="460" height="150"/>
    <text x="24" y="34" class="text-dark subtitle">Grade entry</text>
    <rect x="24" y="54" width="414" height="80" rx="14" fill="#f8fafc"/>
    <text x="40" y="86" class="text-dark small">Select subject and enter EE / ME / AE / BE grades.</text>
    <text x="40" y="110" class="text-muted small">Maths, English, Sciences.</text>
  </g>
  <g transform="translate(718,562)">
    <rect class="panel" x="0" y="0" width="454" height="150"/>
    <text x="24" y="34" class="text-dark subtitle">Reports</text>
    <rect x="24" y="54" width="414" height="80" rx="14" fill="#f8fafc"/>
    <text x="40" y="86" class="text-dark small">Student progress, subject summaries and class analytics.</text>
  </g>

  <g transform="translate(850,34)">
    <circle cx="80" cy="80" r="60" fill="#0ea5e9"/>
    <text x="80" y="86" fill="#ffffff" font-family="Inter, Arial" font-size="36" text-anchor="middle">🤖</text>
    <rect x="12" y="138" width="136" height="52" rx="18" fill="#ffffff" stroke="#e6e9ee"/>
    <text x="22" y="162" class="text-dark small">Teacher bot</text>
    <text x="22" y="180" class="text-dark small">Ask about marks, attendance, students.</text>
  </g>
</svg>
